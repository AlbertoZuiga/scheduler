databases:
  - name: scheduler-db
    databaseName: scheduler_db
    user: scheduler
    plan: free

services:
  - type: web
    name: scheduler-app
    env: python
    buildCommand: "./render-build.sh"
    # --forwarded-allow-ips="*": la IP del proxy de Render no es fija y el default
    # (127.0.0.1) hace que gunicorn descarte los X-Forwarded-*. Sin ellos ProxyFix
    # no ve el esquema real, request.is_secure queda en False y la cookie con
    # SESSION_COOKIE_SECURE no se emite: el login no persiste. Ver DEPLOY-002.
    startCommand: "gunicorn --workers 1 --threads 4 --forwarded-allow-ips=* --access-logfile - run:scheduler_app"
    plan: free
    envVars:
        - key: PYTHON_VERSION
          value: "3.12.11"
        - key: DATABASE_URL
          fromDatabase:
            name: scheduler-db
            property: connectionString
        - key: SECRET_KEY
          generateValue: true