<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="csrf-token" content="{{ csrf_token() }}" />
    <meta name="description" content="{{ self.og_description() }}" />
    <meta name="author" content="Scheduler Team" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>{% block title %}Scheduler{% endblock %} | Coordinación de Horarios</title>
    <link rel="canonical" href="{{ request.base_url }}" />

    <!-- Todo salvo la landing es privado o lleva token en la URL (invitaciones):
         el default es noindex y la landing es la única que opta por indexarse. -->
    <meta name="robots" content="{% block robots %}noindex, nofollow{% endblock %}" />

    <!-- Open Graph / Twitter: preview al compartir (los invite links son el loop de crecimiento). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Scheduler" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:url" content="{{ request.base_url }}" />
    <meta property="og:title" content="{% block og_title %}Scheduler | Coordinación de Horarios{% endblock %}" />
    <meta property="og:description" content="{% block og_description %}Plataforma moderna para coordinar disponibilidad horaria en grupos.{% endblock %}" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="{{ self.og_title() }}" />
    <meta name="twitter:description" content="{{ self.og_description() }}" />

    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">

    <!-- Tema: bloqueante y antes del primer paint para evitar el flash claro (FOUC). -->
    <script nonce="{{ csp_nonce() }}">
      (() => {
        const pref = localStorage.getItem('theme');
        const dark = pref === 'dark' || (!pref && globalThis.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>

    <!-- TailwindCSS compiled stylesheet -->
    <link rel="stylesheet" href="{{ static_url('css/main.css') }}">
    {% block extra_css %}{% endblock %}
  </head>
  <body class="bg-light-background text-light-text-primary dark:bg-dark-background dark:text-dark-text-primary min-h-screen flex flex-col transition-colors duration-300">
    {% include 'partials/navbar.html' %}
    {% include 'partials/flash.html' %}

    <main class="flex-1 w-full max-w-5xl mx-auto px-3 sm:px-4 py-4 sm:py-6">
      {% block content %}{% endblock %}
    </main>

    {% include 'partials/footer.html' %}

    <!-- Custom JS -->
    <script defer src="{{ static_url('js/main.js') }}" nonce="{{ csp_nonce() }}"></script>
    {% block script %}{% endblock %}
  </body>
</html>
