{% extends 'base.html' %}

{% block title %}Unirse a {{ group.name }}{% endblock %}

{% block content %}
<section class="max-w-md mx-auto text-center py-10 sm:py-16">
  <h1 class="text-2xl sm:text-3xl font-semibold">¿Unirte a "{{ group.name }}"?</h1>
  <p class="mt-3 text-light-text-secondary dark:text-dark-text-secondary">
    Te invitaron a este grupo. Al unirte, el resto de los miembros podrá ver tu nombre
    y la disponibilidad horaria que registres.
  </p>

  <div class="mt-8 flex flex-col sm:flex-row gap-3 justify-center">
    <form method="POST" action="{{ url_for('groups.join', token=token) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit"
              class="w-full sm:w-auto px-5 py-2.5 rounded-lg bg-primary text-white hover:bg-primary-dark transition-colors">
        Unirme al grupo
      </button>
    </form>
    <a href="{{ url_for('groups.index') }}"
       class="px-5 py-2.5 rounded-lg border border-light-border dark:border-dark-border hover:bg-light-muted/20 dark:hover:bg-dark-muted/20 transition-colors">
      Cancelar
    </a>
  </div>
</section>
{% endblock %}
