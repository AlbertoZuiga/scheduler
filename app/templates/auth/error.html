{% extends 'base.html' %}

{% block title %}Error de inicio de sesión{% endblock %}

{% block content %}
<section class="max-w-md mx-auto text-center py-12 sm:py-20">
  <div class="w-14 h-14 mx-auto rounded-full bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-300 flex items-center justify-center">
    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" />
    </svg>
  </div>
  <h1 class="mt-4 text-2xl sm:text-3xl font-semibold">No pudimos iniciar tu sesión</h1>
  <p class="mt-3 text-light-text-secondary dark:text-dark-text-secondary">
    {{ message }}
  </p>

  <div class="mt-8 flex flex-col sm:flex-row gap-3 justify-center">
    <a href="{{ url_for('auth.login') }}"
       class="px-5 py-2.5 rounded-lg bg-primary text-white hover:bg-primary-dark transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2">
      Reintentar
    </a>
    <a href="{{ url_for('main.index') }}"
       class="px-5 py-2.5 rounded-lg border border-light-border dark:border-dark-border hover:bg-light-muted/20 dark:hover:bg-dark-muted/20 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2">
      Volver al inicio
    </a>
  </div>
</section>
{% endblock %}
